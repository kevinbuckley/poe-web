[project]
name = "poe-api"
version = "0.1.0"
description = "POE Platform FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "celery>=5.4.0",
  "fastapi>=0.115.6",
  "langgraph>=0.2.62",
  "openai>=1.58.1",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "python-json-logger>=2.0.7",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
