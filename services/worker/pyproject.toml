[project]
name = "poe-worker"
version = "0.1.0"
description = "POE Platform Celery worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
